{% extends 'base.html' %}{% block content %}
<section class="auth card"><h1>{{ 'Create account' if mode == 'register' else 'Sign in' }}</h1>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Email<input type="email" name="email" autocomplete="email" required maxlength="254"></label>
<label>Password<input type="password" name="password" required {% if mode == 'register' %}minlength="12" autocomplete="new-password"{% else %}autocomplete="current-password"{% endif %}></label>
<button class="primary">{{ 'Register' if mode == 'register' else 'Login' }}</button></form>
<p>{% if mode == 'register' %}<a href="{{ url_for('login') }}">Already registered? Sign in</a>{% else %}<a href="{{ url_for('register') }}">Create an account</a>{% endif %}</p></section>
{% endblock %}
